name: Lint and Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  format:
    name: Auto-fix Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Black Formatter
        run: pip install black

      - name: Run Black
        run: black .

      - name: Install Node.js and Prettier
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Prettier
        run: |
          npm install -g prettier
          prettier --write "**/*.{js,ts,json,md,yaml,yml,html,css}"

      - name: Install shfmt
        run: |
          SHFMT_VERSION="3.8.5"
          curl -sSLo /tmp/shfmt https://github.com/mvdan/shfmt/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: Run shfmt for Shell Scripts
        run: /usr/local/bin/shfmt -w -i 2 .

      - name: Commit formatted changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automatic code formatting fixes"
          branch: ${{ github.head_ref || github.ref_name }}
