name: Lint and Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  format:
    name: Auto-fix Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Black
        run: |
          pip install black
          black .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Prettier
        run: |
          npm install -g prettier
          echo ".github/workflows/" >> .prettierignore
          prettier --write "**/*.{js,ts,json,md,yaml,yml,html,css}"

      - name: Set up Go for shfmt
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Install and Run shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          $(go env GOPATH)/bin/shfmt -w -i 2 .

      - name: Format PowerShell Scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $filePath = $_.FullName
              $content = Get-Content $filePath -Raw
              if ($content) {
                  $formatted = Invoke-Formatter -ScriptDefinition $content
                  Set-Content -Path $filePath -Value $formatted
              }
          }

      - name: Commit formatted changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: automatic code formatting fixes"
          branch: ${{ github.head_ref || github.ref_name }}
          skip_ci: true
          push_options: '--force-with-lease'
