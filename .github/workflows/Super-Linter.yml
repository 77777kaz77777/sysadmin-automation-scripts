on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-lint:
    name: Lint and Fix
    runs-on: ubuntu-latest
    permissions:
      # Required to write linting fixes back to the repository
      contents: write 
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint and Fix Code Base
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Enable automatic fixes for specific linters. 
          # You must add or remove these based on your repository's specific languages.
          FIX_YAML_PRETTIER: true
          FIX_SHELL_SHFMT: true
          FIX_JAVASCRIPT_PRETTIER: true
          FIX_PYTHON_BLACK: true
          FIX_MARKDOWN_PRETTIER: true

      - name: Commit and Push Fixes
        # This step takes the files modified by Super-Linter and pushes them to your branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix linting issues"
          commit_user_name: "super-linter-bot"
          commit_user_email: "super-linter@noreply.github.com"
