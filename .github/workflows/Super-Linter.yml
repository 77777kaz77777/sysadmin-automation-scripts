name: Lint and Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    name: Auto-fix Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Black
        run: |
          pip install black
          black .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Prettier
        run: |
          npm install -g prettier
          prettier --write "**/*.{js,ts,json,md,yaml,yml,html,css}"

      - name: Set up Go for shfmt
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install and Run shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          $(go env GOPATH)/bin/shfmt -w -i 2 .

      - name: Format PowerShell Scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $filePath = $_.FullName
              $content = Get-Content $filePath -Raw
              if ($content) {
                  $formatted = Invoke-Formatter -ScriptDefinition $content
                  Set-Content -Path $filePath -Value $formatted
              }
          }

      - name: Commit formatted changes
        id: auto-commit
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply automated formatting fixes [skip ci]"
          skip_fetch: true
          skip_push: true

      - name: Push changes (rebase and retry if the branch moved)
        if: steps.auto-commit.outputs.changes_detected == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow may have pushed to the same branch while this job ran.
          # Rebase onto it (their side wins on overlapping lines) and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1
