name: Auto-Fix Formatting

# One workflow formats everything and makes a single commit.
# (Replaces the old "Lint and Fix" and "Linter Bot" workflows, which overlapped.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    name: Format Python, Shell, PowerShell, JSON, YAML and Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Format Python (Ruff)
        run: |
          pip install ruff
          ruff check . --fix --exit-zero
          ruff format .

      - name: Format shell scripts (shfmt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shfmt
          shfmt -w -i 2 .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Format JSON, YAML and Markdown (Prettier)
        run: npx --yes prettier --write "**/*.{json,md,yaml,yml}"

      - name: Format PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              if ($content) {
                  $formatted = Invoke-Formatter -ScriptDefinition $content
                  if ($formatted -ne $content) { Set-Content -Path $_.FullName -Value $formatted -NoNewline }
              }
          }

      - name: Commit formatted changes
        id: auto-commit
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply automated formatting fixes [skip ci]"
          skip_fetch: true
          skip_push: true

      - name: Push changes (rebase and retry if the branch moved)
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow may have pushed to the same branch while this job ran.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1
