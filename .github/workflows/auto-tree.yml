name: Auto Update README Tables

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme-tables:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate Formatted Tables & Update README
        run: |
          python3 -c '
          import os, re

          FOLDER_DESCS = {
              "updates": "Distro maintenance & update scripts",
              "configs": "Terminal & CLI tool dotfiles",
              "desktop-tweaks": "UI customization & desktop scripts",
              "security": "Antivirus & system defense utilities",
              "utils": "General standalone helper scripts",
              "ansible": "Ansible Automation Guides",
              "containers": "Docker, Podman, and LXC Guides",
              "fedora": "Fedora Linux Specific Documentation",
              "linux-general": "General Linux Reference",
              "networking-and-security": "Networking & Security Configurations",
              "virtualization": "Hypervisor & VM Runbooks",
              "windows-and-macos": "Windows & macOS References",
              "networking": "Networking Automation",
              "provisioning": "User Provisioning & Bootstrapping",
              "proxmox": "Proxmox Virtual Environment Scripts"
          }

          IGNORE_PATHS = {".git", ".github", "README.md", "tree_output.txt"}

          def get_file_description(filepath):
              if not os.path.isfile(filepath):
                  return ""
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for _ in range(5):
                          line = f.readline().strip()
                          if line.startswith("# Description:"):
                              return line.replace("# Description:", "").strip()
                          elif line.startswith("#") and not line.startswith("#!"):
                              return line.lstrip("#").strip()
              except Exception:
                  pass
              return ""

          entries = sorted(
              [e for e in os.listdir(".")
               if e not in IGNORE_PATHS and os.path.isdir(e)]
          )
          table_output = []

          for d in entries:
              folder_desc = FOLDER_DESCS.get(d, "")
              header_desc = (
                  f" ({folder_desc})" if folder_desc else ""
              )

              table_output.append(f"### 📁 {d}/{header_desc}\n")
              table_output.append("| File | Description |")
              table_output.append("|---|---|")

              sub_path = os.path.join(".", d)
              files = sorted(
                  [f for f in os.listdir(sub_path)
                   if f not in IGNORE_PATHS and
                   os.path.isfile(os.path.join(sub_path, f))]
              )

              if not files:
                  table_output.append("| *(Empty)* | |")

              for f in files:
                  file_path = os.path.join(sub_path, f)
                  desc = get_file_description(file_path)
                  table_output.append(f"| <a href=\"{d}/{f}\"><code>{f}</code></a> | {desc} |")

              table_output.append("\n")

          final_str = "\n".join(table_output).strip()

          with open("README.md", "r") as f:
              readme = f.read()

          pattern = r"(<!-- START_SECTION:tree -->)(.*?)" \
                    r"(<!-- END_SECTION:tree -->)"
          updated = re.sub(
              pattern,
              lambda m: m.group(1) + "\n" + final_str + "\n" + m.group(3),
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(updated)
          '

      - name: Commit and Push changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: auto-update directory tables in README"
          skip_fetch: true
          skip_push: true

      - name: Push changes (rebase and retry if the branch moved)
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow may have pushed to the same branch while this job ran.
          # Rebase onto it (their side wins on overlapping lines) and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1
