name: Linter Bot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-fix:
    name: Auto-Fix Codebase
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Latest Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'current'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff yamllint

      - name: Auto-Fix Python (Ruff)
        run: ruff check . --fix --unsafe-fixes --exit-zero

      - name: Auto-Fix JSON (Prettier)
        run: npx --yes prettier --write "**/*.json" || true

      - name: Lint YAML (yamllint)
        run: yamllint . || true

      - name: Commit and Push Changes
        id: auto-commit
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-fix linting and formatting errors"
          skip_fetch: true
          skip_push: true

      - name: Push changes (rebase and retry if the branch moved)
        if: steps.auto-commit.outputs.changes_detected == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow may have pushed to the same branch while this job ran.
          # Rebase onto it (their side wins on overlapping lines) and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1
